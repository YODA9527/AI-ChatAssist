[versions]
agp = "8.6.1"
kotlin = "2.0.21"
macrobenchmark = "1.3.2"
androidxTestExt = "1.2.1"
androidxTestRules = "1.6.1"
junit4 = "4.13.2"
espresso = "3.6.1"
junit5 = "5.11.0"
junitPlatform = "1.11.0"

[libraries]
androidx-benchmark-macro-junit4 = { group = "androidx.benchmark", name = "benchmark-macro-junit4", version.ref = "macrobenchmark" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExt" }
androidx-test-rules = { group = "androidx.test", name = "rules", version.ref = "androidxTestRules" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
junit4 = { group = "junit", name = "junit", version.ref = "junit4" }
junit5-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junit5" }
junit5-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher", version.ref = "junitPlatform" }

[plugins]
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
