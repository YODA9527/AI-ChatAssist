# Dependabot 备用配置
# 若不使用 Renovate,启用此文件
# 详细配置: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2

updates:
  # Gradle 依赖
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 10
    labels:
      - "type: dependencies"
    groups:
      android:
        patterns:
          - "androidx.*"
          - "com.google.android.material:*"
      hilt-stack:
        patterns:
          - "com.google.dagger:*"
          - "com.google.devtools.ksp:*"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "type: dependencies"
