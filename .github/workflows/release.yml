name: Release

# 手动触发: Actions → Release Drafter → Run workflow → 选版本号
# 发布到 GitHub Release (草稿),产物上传 APK / AAB

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: '版本号,例 v0.22.0'
        required: true
        default: 'v0.22.0'
      version_code:
        description: 'versionCode (整数,递增)'
        required: true
        default: '22'

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Bump version (versionName / versionCode)
        run: |
          sed -i "s/versionName = \".*\"/versionName = \"${{ inputs.version_name }}\"/" app/build.gradle.kts
          sed -i "s/versionCode = .*/versionCode = ${{ inputs.version_code }}/" app/build.gradle.kts
          cat app/build.gradle.kts | grep -E "version(Name|Code)"

      - name: Build Release APK (unsigned)
        run: ./gradlew assembleRelease --no-daemon

      - name: Build Release AAB
        run: ./gradlew bundleRelease --no-daemon

      - name: Create GitHub Release (Draft)
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: ${{ inputs.version_name }}
          body: |
            ## ChatAssist ${{ inputs.version_name }}

            ### 📦 下载
            - **app-release.apk** — 通用 APK
            - **app-release.aab** — 上架 Google Play 用

            ### 📋 变更
            详见 [CHANGELOG.md](../../blob/main/CHANGELOG.md)

            ### ⚠️ 提示
            这是预发布版,需在 GitHub Release 页编辑 → 「Publish release」才对外可见。
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          fail_on_unmatched_files: false
