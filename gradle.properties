# JVM 配置：2G 堆（机器 32GB RAM，OOM 因为 benchmark 装入 65MB APK + perfetto native 占了 native heap 太多）
org.gradle.jvmargs=-Xmx2048m -XX:+UseParallelGC -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=512m
# 启用并行构建 + 构建缓存 + 配置缓存（提速 30%+）
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# 并行 worker 数（机器 32GB 内存 / 8+ cores）
org.gradle.workers.max=8

# AndroidX 强制开关
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false
# 显式启用 R8 fullmode（默认已开启，但显式声明更稳）
android.enableR8.fullMode=true
# BuildConfig 在 app/build.gradle.kts 中显式启用，AGP 9.0 后此设置会废弃

# Kotlin 官方代码风格
kotlin.code.style=official
# 增量编译
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true
# KSP 增量（KSP1，与 useKSP2=false 配套）
ksp.incremental=true
# KSP2 暂未启用：Hilt 2.52 + KSP2 存在兼容性问题，详见 https://github.com/google/dagger/issues/4258
ksp.useKSP2=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
