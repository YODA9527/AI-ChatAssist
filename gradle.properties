# JVM 配置：4G 堆 + UTF-8 + 并行 GC
org.gradle.jvmargs=-Xmx4096m -XX:+UseParallelGC -Dfile.encoding=UTF-8
# 启用并行构建 + 构建缓存 + 配置缓存（提速 30%+）
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX 强制开关
android.useAndroidX=true
android.nonTransitiveRClass=true
# BuildConfig 在 app/build.gradle.kts 中显式启用，AGP 9.0 后此设置会废弃

# Kotlin 官方代码风格
kotlin.code.style=official
# KSP2 暂未启用：Hilt 2.52 + KSP2 存在兼容性问题，详见 https://github.com/google/dagger/issues/4258
ksp.useKSP2=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
